<!doctype html><meta charset="utf-8"><title>05 webgl — plume</title>
<style>
@font-face{font-family:STIXi;src:url(file:///usr/local/lib/python3.11/dist-packages/matplotlib/mpl-data/fonts/ttf/STIXGeneralItalic.ttf)}
html,body{margin:0;background:#000;width:1280px;height:720px;overflow:hidden}
canvas{position:absolute;inset:0}
.t{position:absolute;font-family:"DejaVu Sans";color:#fff;text-align:center;left:0;right:0;opacity:0}
#h{top:56px;font-size:20px;color:#5CD0B3;letter-spacing:.08em}
#cap{bottom:56px;font-size:26px}
#lab{position:absolute;left:760px;top:236px;font:italic 26px STIXi;color:#FFFF00;opacity:0}
#lab i{display:block;font:15px "DejaVu Sans";color:#888;margin-top:2px;font-style:normal}
svg{position:absolute;inset:0;pointer-events:none}
</style>
<canvas id="c" width="1280" height="720"></canvas>
<svg width="1280" height="720"><line id="ld" x1="752" y1="252" x2="676" y2="270" stroke="#FFFF00" stroke-width="1.5" opacity="0"/></svg>
<div class="t" id="h">EXHAUST PLUME</div>
<div id="lab">shock diamonds<i>the jet re-adjusting to the air's pressure</i></div>
<div class="t" id="cap">Every bright knot is a shock wave. The gas leaves at 2.8 km/s.</div>
<script>
// Demo 05 — raw WebGL, one fragment shader. Procedural exhaust: FBM turbulence, temperature colour ramp, shock diamonds.
const gl = document.getElementById('c').getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
const VS = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;
const FS = `precision highp float; uniform vec2 uRes; uniform float uT; uniform float uThr;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+vec2(7.3,1.9); a*=.5; } return v; }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = vec2((uv.x-0.5)*uRes.x/uRes.y, 0.78-uv.y);      // p.y = distance below the nozzle exit
  vec3 col = vec3(0.);
  // nozzle bell (grey), exit at p.y = 0
  if (p.y <= 0. && p.y > -0.24) {
    float hw = mix(0.078, 0.034, pow(-p.y/0.24, 0.65));
    float d = abs(p.x) - hw;
    col += vec3(0.62) * smoothstep(0.005, 0.0, abs(d + 0.0025));
    col += vec3(0.10, 0.11, 0.13) * smoothstep(0.0, -0.004, d);
    col += vec3(1.0,0.75,0.4) * smoothstep(0.0,-0.02,d) * uThr * (0.25 + 0.75*smoothstep(-0.24,0.0,p.y)) * 0.35;   // chamber glow leaking down the bell
  }
  if (p.y > 0.) {
    float L = 0.9 * uThr + 0.02;
    float yy = p.y / L;
    float hw = 0.078 * (1.0 + 0.45 * yy);
    float n = fbm(vec2(p.x * 9.0, p.y * 7.0 - uT * 3.2));
    float r = abs(p.x + (n - 0.5) * 0.06 * yy) / hw;
    float core = exp(-r * r * 3.2);
    float fade = smoothstep(1.0, 0.2, yy);
    float flick = 0.7 + 0.6 * fbm(vec2(p.y * 6.0 - uT * 5.0, p.x * 4.0 + 3.0));
    float I = core * fade * flick * uThr;
    float k = 6.28318 / 0.095;
    float diamond = pow(max(0., cos((p.y - 0.048) * k)), 14.0) * exp(-r * r * 9.0) * exp(-p.y * 4.0) * uThr;
    float T = I + 1.7 * diamond;
    vec3 c = mix(vec3(0.85, 0.12, 0.04), vec3(1.0, 0.52, 0.12), smoothstep(0.12, 0.5, T));
    c = mix(c, vec3(1.0, 0.96, 0.8), smoothstep(0.55, 1.15, T));
    col += c * T;
    col += vec3(1.0, 0.4, 0.15) * exp(-r * r * 0.5) * 0.10 * fade * uThr;
  }
  gl_FragColor = vec4(col, 1.0);
}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const a = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
const uRes = gl.getUniformLocation(prog, 'uRes'), uT = gl.getUniformLocation(prog, 'uT'), uThr = gl.getUniformLocation(prog, 'uThr');
const smooth = t => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); }, seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
window.render = function (t) {
  gl.viewport(0, 0, 1280, 720); gl.uniform2f(uRes, 1280, 720); gl.uniform1f(uT, t); gl.uniform1f(uThr, smooth(seg(t, 0.3, 1.9)));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
  document.getElementById('h').style.opacity = smooth(seg(t, 0, .6));
  document.getElementById('lab').style.opacity = document.getElementById('ld').style.opacity = smooth(seg(t, 2.1, 2.7));
  document.getElementById('cap').style.opacity = smooth(seg(t, 2.8, 3.4));
  return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
};
</script>
