<!doctype html><meta charset="utf-8"><title>10 svg smil — orbit</title>
<style>
@font-face{font-family:STIXi;src:url(file:///usr/local/lib/python3.11/dist-packages/matplotlib/mpl-data/fonts/ttf/STIXGeneralItalic.ttf)}
@font-face{font-family:STIX;src:url(file:///usr/local/lib/python3.11/dist-packages/matplotlib/mpl-data/fonts/ttf/STIXGeneral.ttf)}
html,body{margin:0;background:#000;width:1280px;height:720px;overflow:hidden}
text{font-family:"DejaVu Sans"} .it{font-family:STIXi} .sf{font-family:STIX}
</style>
<!-- Demo 10 — declarative SVG + SMIL. No script draws anything: every motion is an <animate> element; we only seek the document clock. -->
<svg id="s" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="earth" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#2b7fd6"/><stop offset="1" stop-color="#0b2a5e"/></radialGradient>
    <radialGradient id="atmo" cx=".5" cy=".5" r=".5"><stop offset=".84" stop-color="#58C4DD" stop-opacity="0"/><stop offset=".93" stop-color="#58C4DD" stop-opacity=".35"/><stop offset="1" stop-color="#58C4DD" stop-opacity="0"/></radialGradient>
    <marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#888"/></marker>
    <marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#83C167"/></marker>
    <path id="orbit" d="M 802.6,207.4 A 230,230 0 1 1 477.4,532.6 A 230,230 0 1 1 802.6,207.4"/>
  </defs>
  <g fill="#999"><circle cx="90" cy="80" r="1.2"/><circle cx="210" cy="300" r="1"/><circle cx="150" cy="520" r="1.6"/><circle cx="330" cy="120" r="1"/><circle cx="1140" cy="90" r="1.4"/><circle cx="1210" cy="330" r="1"/><circle cx="1090" cy="600" r="1.6"/><circle cx="980" cy="60" r="1"/><circle cx="60" cy="660" r="1.2"/><circle cx="1240" cy="680" r="1"/><circle cx="420" cy="690" r="1.3"/><circle cx="880" cy="700" r="1"/><circle cx="300" cy="400" r="1"/><circle cx="1000" cy="430" r="1.2"/></g>
  <circle cx="640" cy="370" r="230" fill="url(#atmo)"/>
  <circle cx="640" cy="370" r="200" fill="url(#earth)"/>
  <path d="M640 170 A200 200 0 0 1 640 570 Z" fill="#000" opacity=".35"/>
  <circle cx="640" cy="370" r="200" fill="none" stroke="#58C4DD" stroke-width="1.5" opacity=".8"/>
  <!-- the ascent: a gravity turn from the launch site, drawn by unwinding its dash -->
  <path id="asc" d="M640,170 C640,120 690,108 740,148 C766,169 786,192 802.6,207.4" fill="none" stroke="#FC6255" stroke-width="3" stroke-dasharray="260" stroke-dashoffset="260" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="260" to="0" begin="0.4s" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1"/>
  </path>
  <circle cx="640" cy="170" r="4" fill="#FC6255"/>
  <!-- the orbit reveals itself as the ship arrives -->
  <use href="#orbit" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6 8" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.5s" fill="freeze"/></use>
  <!-- the ship rides the orbit; rotate=auto keeps its x-axis on the tangent, so velocity is +x and gravity is +y in its frame -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.55s" dur="0.2s" fill="freeze"/>
    <animateMotion begin="1.55s" dur="4.2s" rotate="auto" fill="freeze" calcMode="linear"><mpath href="#orbit"/></animateMotion>
    <line x1="0" y1="0" x2="0" y2="70" stroke="#888" stroke-width="3" marker-end="url(#mg)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.4s" fill="freeze"/></line>
    <line x1="0" y1="0" x2="80" y2="0" stroke="#83C167" stroke-width="3" marker-end="url(#mv)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.4s" fill="freeze"/></line>
    <circle r="7" fill="#fff" stroke="#FC6255" stroke-width="3"/>
  </g>
  <text x="640" y="66" text-anchor="middle" font-size="20" fill="#5CD0B3" letter-spacing="2" opacity="0">ORBIT<animate attributeName="opacity" to="1" begin="0s" dur="0.5s" fill="freeze"/></text>
  <text x="1010" y="300" font-size="26" class="it" fill="#888" opacity="0">gravity<animate attributeName="opacity" to="1" begin="2.1s" dur="0.4s" fill="freeze"/></text>
  <text x="1010" y="336" font-size="18" fill="#888" opacity="0">always toward the centre<animate attributeName="opacity" to="1" begin="2.1s" dur="0.4s" fill="freeze"/></text>
  <text x="1010" y="390" font-size="26" class="it" fill="#83C167" opacity="0">velocity<animate attributeName="opacity" to="1" begin="2.5s" dur="0.4s" fill="freeze"/></text>
  <text x="1010" y="426" font-size="18" fill="#83C167" opacity="0">7.8 km/s, sideways<animate attributeName="opacity" to="1" begin="2.5s" dur="0.4s" fill="freeze"/></text>
  <text x="640" y="664" text-anchor="middle" font-size="30" class="sf" fill="#fff" opacity="0">Orbit is falling —<animate attributeName="opacity" to="1" begin="3.0s" dur="0.5s" fill="freeze"/></text>
  <text x="640" y="700" text-anchor="middle" font-size="30" class="it" fill="#FFFF00" opacity="0">and missing the ground, forever.<animate attributeName="opacity" to="1" begin="3.7s" dur="0.5s" fill="freeze"/></text>
  <text x="270" y="140" text-anchor="middle" font-size="18" fill="#FC6255" opacity="0">gravity turn: lean over early,<animate attributeName="opacity" to="1" begin="0.6s" dur="0.4s" fill="freeze"/></text>
  <text x="270" y="166" text-anchor="middle" font-size="18" fill="#FC6255" opacity="0">spend the burn going sideways<animate attributeName="opacity" to="1" begin="0.6s" dur="0.4s" fill="freeze"/></text>
</svg>
<script>
const svg = document.getElementById('s'); svg.pauseAnimations();
window.render = t => { svg.setCurrentTime(t); return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); };
</script>
