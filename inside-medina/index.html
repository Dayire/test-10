<style>
/* the splash paints before any script: the wordmark and a turning brass rosette (compositor-only) */
html,body{margin:0;height:100%;background:#0b0806;overflow:hidden}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:22px;background:radial-gradient(ellipse 80% 70% at 50% 46%,#1d130c 0%,#0b0806 70%);font-family:'Cormorant Garamond',Georgia,serif;color:#e9d9bf}
#loading .lmark{width:54px;height:54px;color:#dcb46f;will-change:transform;animation:lspin 9s linear infinite}
#loading .lmark svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
#loading .lt{font-size:clamp(30px,5vw,58px);letter-spacing:.6em;padding-left:.6em;font-weight:300}
#loading .lbar{width:min(260px,56vw);height:1px;background:rgba(233,217,191,.14);overflow:hidden}
#loading .lbar i{display:block;height:100%;width:0;background:#e9c48f}
#loading .lmsg{font-size:14px;letter-spacing:.22em;color:rgba(233,217,191,.46);font-style:italic;min-height:1.2em}
@keyframes lspin{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="./src/ui/style.css" />
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Medina game view"></canvas>

<script type="module" src="./src/main.js"></script>
</body>
</html>
